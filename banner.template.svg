<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Rakshith S — IoT &amp; Cybersecurity" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,'Courier New',monospace; }
    .dim { fill: #6B7280; }
    .grn { fill: #10B981; }
    .cyn { fill: #22D3EE; }
    .wht { fill: #E5E7EB; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
  <defs>
    <clipPath id="av"><circle cx="860" cy="172" r="78"/></clipPath>
  </defs>

  <!-- window -->
  <rect width="1000" height="300" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#243047"/>
  <rect width="1000" height="40" rx="14" fill="#111827"/>
  <rect y="26" width="1000" height="14" fill="#111827"/>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#243047"/>
  <circle cx="26" cy="20" r="6" fill="#EF4444"/>
  <circle cx="48" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="20" r="6" fill="#10B981"/>
  <text x="500" y="25" font-size="13" text-anchor="middle" class="dim">rakshith@sentinel: ~</text>

  <!-- content -->
  <text x="40" y="84" font-size="18"><tspan class="grn">$</tspan><tspan class="wht"> whoami</tspan></text>
  <text x="40" y="136" font-size="46" font-weight="700" class="wht">Rakshith S</text>
  <text x="40" y="172" font-size="22" class="cyn">&gt; IoT &amp; Cybersecurity</text>
  <text x="40" y="214" font-size="18"><tspan class="grn">$</tspan><tspan class="wht"> cat mission.txt</tspan></text>
  <text x="40" y="244" font-size="16" class="dim">Building things that talk to hardware and think for themselves.</text>
  <text x="40" y="278" font-size="18" class="grn">$</text>
  <rect class="cur" x="58" y="264" width="10" height="17" fill="#22D3EE"/>

  <!-- avatar -->
  <circle cx="860" cy="172" r="84" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <circle cx="860" cy="172" r="78" fill="#111827"/>
  <image href="__AVATAR__" x="782" y="94" width="156" height="156" preserveAspectRatio="xMidYMid slice" clip-path="url(#av)"/>
</svg>
